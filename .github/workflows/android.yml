name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build tools
        run: sdkmanager 'platform-tools' 'build-tools;34.0.0' 'platforms;android-34'
      - name: Install pinned Godot and Android templates
        run: |
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo ln -s /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -jq /tmp/templates.tpz templates/android_debug.apk templates/android_release.apk templates/version.txt -d "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          python3 scripts/fetch_font.py
      - name: Cache development signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ember-camp-debug-key-v1
      - name: Configure Android export
        run: |
          mkdir -p "$HOME/.android" "$HOME/.config/godot" build
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname 'CN=EmberCamp Debug' -keyalg RSA -validity 10000
          fi
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Import and validate game
        run: |
          godot --headless --path . --editor --import --quit 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|Parse Error' /tmp/import.log; then exit 1; fi
          godot --headless --path . --script tests/test_rules.gd
          XDG_DATA_HOME=/tmp/ember-touch godot --headless --path . --script tests/test_touch.gd
          mkdir -p /tmp/ember-smoke
          XDG_DATA_HOME=/tmp/ember-smoke godot --headless --path . --script tests/smoke.gd
      - name: Export and verify APK signature
        run: |
          godot --headless --path . --export-debug Android build/ember-camp-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose build/ember-camp-debug.apk
          sha256sum build/ember-camp-debug.apk > build/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ember-camp-debug
          path: |
            build/ember-camp-debug.apk
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
